name: Auto Update & Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: '45 11 * * 3,5,0' # 18:45 VN các ngày T4, T6, CN
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Install Dependencies
        run: |
          if [ -f package.json ]; then npm install; fi

      - name: 4. Install Chrome for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: 5. Run Crawler
        run: node crawler.js update

      - name: 6. Commit & Push New Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if git status --porcelain | grep -E "data/history6.json|data/history6.csv"; then
            echo "⚡ Có kỳ mới! Tiến hành commit..."
            git add data/
            git commit -m "🤖 [Auto Bot] Update Vietlott draw data"
            git push
          else
            echo "✅ Dữ liệu đã ở bản mới nhất."
          fi