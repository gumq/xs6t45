name: Auto Update Vietlott Data

on:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: '45 11 * * 3,5,0' # 18:45 VN các ngày T4, T6, CN
  workflow_dispatch:

jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Chuyển sang Node 20 để hỗ trợ tốt nhất cho Puppeteer ESM

      - name: 3. Cài đặt các gói phụ thuộc (Dependencies)
        run: |
          if [ -f package.json ]; then npm install; fi

      - name: 4. Cài đặt Chrome cho Puppeteer trên Ubuntu Máy Ảo
        run: |
          npx puppeteer browsers install chrome

      - name: 5. Chạy script crawler với các biến môi trường Puppeteer Headless
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'false'
        run: node crawler.js

      - name: 6. Kiểm tra và Commit dữ liệu mới (Nếu có)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if git status --porcelain | grep -q "data/history6.json"; then
            echo "⚡ Phát hiện kỳ quay mới! Tiến hành commit dữ liệu..."
            git add data/history6.json
            git commit -m "🤖 [Auto Bot] Cập nhật kết quả Vietlott mới nhất"
            git push
          else
            echo "✅ Dữ liệu history6.json đã ở bản mới nhất."
          fi